<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Campanha</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }

  video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 20px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div id="overlay">Toque para iniciar</div>

<video id="video">
  <source src="video.mp4" type="video/mp4">
</video>

<script>
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');

  overlay.addEventListener('click', () => {
    video.muted = false;
    video.play();

    if (video.requestFullscreen) {
      video.requestFullscreen();
    }

    overlay.style.display = 'none';
  });
</script>

</body>
</html>
