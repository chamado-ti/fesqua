<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Campanha</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }

  video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: black;
  }
</style>
</head>

<body>

<video id="video" autoplay muted playsinline>
  <source src="video0.mp4" type="video/mp4">
</video>

<script>
  const video = document.getElementById('video');

  // força o autoplay ao carregar
  window.addEventListener('load', () => {
    video.play().catch(err => {
      console.log("Autoplay bloqueado:", err);
    });
  });
</script>

</body>
</html>
