<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Campanha</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  #startScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #botao {
    background: white;
    color: black;
    padding: 15px 25px;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div id="startScreen">
  <div id="botao">👀 Veja o que te espera</div>
</div>

<video id="video" playsinline controls>
  <source src="video0.mp4" type="video/mp4">
</video>

<script>
  const video = document.getElementById('video');
  const startScreen = document.getElementById('startScreen');

  document.getElementById('botao').addEventListener('click', () => {
    startScreen.style.display = 'none';

    video.style.display = 'block';
    video.muted = false;

    video.play();

    if (video.requestFullscreen) {
      video.requestFullscreen();
    } else if (video.webkitRequestFullscreen) {
      video.webkitRequestFullscreen();
    }
  });
</script>

</body>
</html>
